<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#F3F4F6"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6D28D9" flood-opacity=".35"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="36" cy="13" r="8" fill="#A78BFA" opacity=".35" filter="url(#glow)"/>

  <!-- Resume -->
  <g filter="url(#shadow)">
    <rect x="11" y="8" width="18" height="26" rx="3" fill="url(#glass)"/>
    <rect x="15" y="14" width="9" height="2" rx="1" fill="#7C3AED"/>
    <rect x="15" y="19" width="11" height="1.8" rx=".9" fill="#94A3B8"/>
    <rect x="15" y="23" width="9" height="1.8" rx=".9" fill="#94A3B8"/>
    <rect x="15" y="27" width="7" height="1.8" rx=".9" fill="#94A3B8"/>
  </g>

  <!-- Magnifying Glass -->
  <circle cx="31.5" cy="28.5" r="6.2"
          stroke="#fff"
          stroke-width="2.4"
          fill="none"/>

  <line x1="36.2" y1="33.2"
        x2="40.5" y2="37.5"
        stroke="#fff"
        stroke-width="2.6"
        stroke-linecap="round"/>

  <!-- Check -->
  <path d="M28.8 28.6l1.9 1.9 3.7-4"
        stroke="#22C55E"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

</svg>
